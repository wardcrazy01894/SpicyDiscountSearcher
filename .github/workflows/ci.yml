name: ci

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR supersedes the first; nothing is gained by finishing
# the run for a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs only. Cancelling a push-to-main run on a rapid second merge would leave
  # a main commit with no green record of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token. gitleaks-action calls the pulls API for a PR's base and
# head refs, which succeeds here on contents: read only because the repository
# is public — if it ever goes private this job will 403 and want
# pull-requests: read back. The scope was dropped because the action's PR
# comments (disabled below) would have needed *write*, not read.
permissions:
  contents: read

jobs:
  build:
    name: build / typecheck / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Audit dependencies (informational)
        # NOT --omit=dev. There are no runtime dependencies at all, so that
        # audited an empty tree and always passed — while the dev tree is what
        # vite bundles into dist/, i.e. the code users actually load.
        # Still informational: the current tree has known advisories whose only
        # fixes are major bumps, tracked by the dependabot config added here.
        # Once those land this should lose continue-on-error and gate for real.
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Build (vite)
        run: npm run build
      - name: Check the built extension is loadable
        # A manifest that points at a file the build never emitted installs
        # fine and then fails silently, so verify every referenced path exists.
        run: node scripts/check-dist.mjs
      - name: Upload unpacked extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spicy-discount-searcher-unpacked
          path: dist/
          retention-days: 14

  data:
    name: data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install openpyxl
        # Pinned: this job compares generated bytes against committed bytes, so
        # a parser release that changes cell coercion turns a green PR red with
        # no code change — or hides real drift by moving both sides together.
        # Deliberately a manual pin: Dependabot needs a manifest to track, and a
        # requirements file for one dependency is not worth the indirection.
        run: pip install 'openpyxl==3.1.5'
      - name: Regenerate the code database
        run: python3 scripts/extract_codes.py
      - name: Fail if the committed database is stale
        # The JSON is generated from the workbook; if someone edits one without
        # the other, the extension ships codes that no longer match the source.
        run: git diff --exit-code -- src/data/codes.generated.json

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Run tests (vitest)
        run: npm test

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits on the branch
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On by default, and it posts a PR review comment — which needs
          # pull-requests: write. With the read-only token above it would 403
          # at exactly the moment a leak was found. Failing the job is the
          # signal we want anyway.
          GITLEAKS_ENABLE_COMMENTS: false
