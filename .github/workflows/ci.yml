name: ci

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR supersedes the first; nothing is gained by finishing
# the run for a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs only. Cancelling a push-to-main run on a rapid second merge would leave
  # a main commit with no green record of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token. gitleaks-action calls the pulls API for a PR's base and
# head refs, which succeeds here on contents: read only because the repository
# is public — if it ever goes private this job will 403 and want
# pull-requests: read back. The scope was dropped because the action's PR
# comments (disabled below) would have needed *write*, not read.
permissions:
  contents: read

jobs:
  build:
    name: build / typecheck / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Build (vite)
        run: npm run build
      - name: Check the built extension is loadable
        # A manifest that points at a file the build never emitted installs
        # fine and then fails silently, so verify every referenced path exists.
        run: node scripts/check-dist.mjs
      - name: Audit dependencies
        # Last, deliberately. npm audit hits the registry at run time, so a new
        # advisory with no fix available turns a green PR red overnight — and
        # from step three it would abort before typecheck, lint or build had
        # said anything, on every PR, since this job is required.
        #
        # NOT --omit=dev. There are no runtime dependencies at all, so that
        # audited an empty tree and always passed — while the dev tree is what
        # vite bundles into dist/, i.e. the code users actually load.
        # No continue-on-error: the tree is clean at every severity, so this
        # gates — and at moderate, since a moderate advisory still ends up in
        # the bundle users load.
        run: npm audit --audit-level=moderate

      - name: Upload unpacked extension
        # always(): a registry-side advisory failing the audit step above must
        # not also withhold the built extension, which is exactly what you want
        # to inspect when a run goes red for a reason unrelated to your change.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spicy-discount-searcher-unpacked
          path: dist/
          retention-days: 14

  data:
    name: data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install openpyxl
        # Pinned: this job compares generated bytes against committed bytes, so
        # a parser release that changes cell coercion turns a green PR red with
        # no code change — or hides real drift by moving both sides together.
        # Deliberately a manual pin: Dependabot needs a manifest to track, and a
        # requirements file for one dependency is not worth the indirection.
        # pytest here, not via pipx: the tests exec extract_codes.py, which
        # imports openpyxl, and a pipx-isolated venv would not have it. That
        # mistake did not just skip the tests — the step aborted before the
        # freshness check below, so the repo's first ground rule went unchecked.
        run: pip install 'openpyxl==3.1.5' 'pytest==8.4.2'
      - name: Lint the parser (ruff)
        # Directories, not one named file. Naming the single file that exists
        # today means the next Python file added is silently never linted.
        # Rules come from ruff.toml — the default set is E4/E7/E9 plus F, which
        # is close to nothing on a parser this size.
        run: pipx run ruff==0.14.2 check scripts tests
      - name: Format check the parser (ruff)
        # The TypeScript side has had prettier as a required check since the
        # start; the Python side had no formatting gate at all.
        run: pipx run ruff==0.14.2 format --check scripts tests

      - name: Test the parser (pytest)
        # The freshness check below cannot catch a parser that is wrong in the
        # same way twice — it regenerates both sides. These cover the decisions.
        # Same reason as ruff above for pointing at the directory: a test file
        # nothing runs is worse than no test file, because it reads as covered.
        run: python3 -m pytest tests -q

      - name: Regenerate the code database
        run: python3 scripts/extract_codes.py
      - name: Fail if the committed database is stale
        # The JSON is generated from the workbook; if someone edits one without
        # the other, the extension ships codes that no longer match the source.
        run: git diff --exit-code -- src/data/codes.generated.json

  # Named `test-matrix`, not `test`, on purpose. A matrix job produces one check
  # context per leg, never a single one: GitHub appends the matrix values unless
  # the name already interpolates them. `name: test` gave `test (22)` and
  # `test (24)`; the interpolated name below gives one `test node NN` per leg.
  # Either way there is no context called `test`, so making *this* the
  # `test` job meant the required context never reported and every PR blocked
  # forever. Verified: it did exactly that. The job below keeps the name.
  test-matrix:
    name: test node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every version package.json claims. CI ran only 22, so 24 — what local
      # development actually uses — and 26 both went untested while `engines`
      # advertised them. `setup-node` downloads versions the runner image does
      # not cache, so an uncached 26 costs a little time, not a failure.
      # The build job stays single-version so the artifact is deterministic.
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Run tests (vitest)
        run: npm test

  # The required check. Reports one context named `test` whatever the matrix is
  # called, and fails if any leg did — so adding a Node version does not mean
  # editing branch protection, and a red leg still blocks.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-matrix
    # always(), unlike the workbook scan below which deliberately uses
    # !cancelled(). The difference is that this context is *required*, and a
    # required job skipped by a conditional reports **Success** — GitHub counts
    # `success`, `skipped` and `neutral` alike — so `!cancelled()` would post a
    # green `test` for a run that checked nothing. That is the failure mode
    # here, not a stuck PR. GitHub's own guidance for required checks that
    # `needs` another job is to use `always()`.
    #
    # The cost is that a run superseded by cancel-in-progress posts a red
    # `test` against the SHA nobody is merging.
    if: always()
    steps:
      - name: Every Node version passed
        # `needs.*.result` is 'success' only when every leg succeeded; skipped
        # or cancelled counts as not-passed, which is what we want from a gate.
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "all Node versions passed"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits on the branch
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On by default, and it posts a PR review comment — which needs
          # pull-requests: write. With the read-only token above it would 403
          # at exactly the moment a leak was found. Failing the job is the
          # signal we want anyway.
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Scan the workbook for personal data
        # gitleaks drops the .xlsx by extension before any repo config applies
        # (.gitleaks.toml says so itself), so the one binary in this repo is
        # the one file it never reads — which is exactly how a contributor's
        # name and an internal staging host reached a public repo in 9bbf418.
        # This unzips it and reads the parts a spreadsheet hides. Stdlib only,
        # so there is nothing to install.
        #
        # After gitleaks, and !cancelled(): the two look for different things,
        # and a name found in the workbook must not withhold a credential found
        # in the history. Same reasoning as the audit step in the build job.
        # Not always() — PR runs are superseded by design (cancel-in-progress
        # above), and there is nothing to learn from a run nobody is waiting on.
        if: '!cancelled()'
        run: python3 scripts/scan_workbook_pii.py
