# The CI `secret scan` job never looks at history, and cannot be made to.
#
# `gitleaks-action` chooses the scan range itself, from the event type, in
# `src/gitleaks.js`: a `push` gets `--log-opts=-1` when the pushed range is a
# single commit (which a squash merge always is), a `pull_request` gets
# `--log-opts=--no-merges --first-parent <base>^..<head>`. Both scan only the
# commits that arrived. Verified against real runs on this repo: the PR run for
# #33 reported `1 commits scanned. scanned ~748 bytes`, and the push run for
# 658a798 reported `1 commits scanned` with `--log-opts=-1`.
#
# The action appends no `--log-opts` at all for `workflow_dispatch` and
# `schedule` — that branch is this file's entire reason to exist. With no range,
# `gitleaks detect` walks every commit, which is the only way anything here
# looks at what was *ever* committed rather than what just arrived.
#
# That distinction is not academic for this repository: the incident it exists
# to catch was a blob in history, still reachable by SHA after the working tree
# had been scrubbed. A per-push scan is structurally blind to that, because by
# the time you know, the commit that introduced it is old.
#
# Separate workflow rather than a cron on `ci.yml`: a schedule there would run
# the whole matrix — three Node versions, the Python job, a build — to answer a
# question none of them ask.
name: secret history scan

on:
  schedule:
    # Weekly, Monday 05:17 UTC. Off the hour because GitHub drops scheduled
    # runs when too many fire at once, and :00 is the worst minute to pick.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan
  cancel-in-progress: false

jobs:
  history:
    name: gitleaks over full history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Genuinely load-bearing here, unlike in ci.yml: with no `--log-opts`
          # gitleaks walks the whole graph, so every commit has to be present
          # locally. A shallow clone would silently scan only what it fetched
          # and still report success.
          fetch-depth: 0

      - name: Scan for secrets (gitleaks, full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same reasoning as ci.yml: comments need pull-requests: write, which
          # this token does not have, and there is no PR to comment on anyway.
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Say what was actually scanned
        # A green gitleaks job and a gitleaks job that scanned nothing look
        # identical from the outside — that is precisely how the gap this
        # workflow closes went unnoticed. The commit count in the log above is
        # the evidence; this step makes it something you can read without
        # opening the log.
        if: '!cancelled()'
        run: |
          echo "Commits in this checkout: $(git rev-list --count --all)"
          echo "gitleaks was invoked with no --log-opts, so its own"
          echo "'N commits scanned' line above should match that number."
