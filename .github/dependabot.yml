# The toolchain is what builds dist/, so its advisories are the ones that
# matter here — there are no runtime dependencies. Grouped so a refresh is one
# reviewable PR rather than a dozen, and monthly because this is a small repo
# and weekly churn would just get ignored.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Minor and patch only. Grouping majors too would put vite 5->8 and
      # vitest 2->4 in one PR, so a single breaking bump would block every
      # security fix behind it; majors arrive individually instead.
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 cannot be installed here, and the blocker is upstream.
      # `typescript-eslint@8.72.0` -- the newest release, and its canary --
      # declares `peer typescript ">=4.8.4 <6.1.0"` (still, as of the
      # 2026-10-26 bump from 8.65.0), so `npm ci` fails to resolve before a
      # line is compiled. There is no 9.x.
      #
      # The repo itself is ready. Measured on Dependabot's own branch with
      # --legacy-peer-deps: tsc --noEmit clean under 7.0.2, 261 tests passing,
      # build and check-dist clean. So this is a wait, not a migration.
      #
      # The stable 6.x this once said did not exist now does, and is what we
      # build on: typescript@6.0.3 resolves under a plain `npm ci`. That is the
      # whole difference from 7 -- it is inside the peer range, not tolerated in
      # spite of it -- so it changes nothing about the block below.
      #
      # Ignored rather than left to fail monthly, because a recurring red PR on
      # an upgrade nobody can take is noise. REMOVE THIS ENTRY when
      # typescript-eslint ships a version whose typescript peer range admits 7 —
      # its own major bump arrives as a separate PR (majors are ungrouped
      # above), and that PR is the cue.
      #
      # The bound is <6.1.0, so TypeScript 6.1 will be unresolvable for exactly
      # this reason while falling outside the 7.x pattern below. Not pre-emptively
      # ignored: typescript-eslint widening its range is likelier to land first,
      # and an ignore added now would swallow a 6.1 bump that had become fine.
      - dependency-name: typescript
        versions: ['7.x']
      # @types/node tracks the LOWEST Node this repo runs on, not the newest.
      # What `tsc` accepts is decided by the installed typings major, and the
      # runtime it must not exceed is the lowest leg of ci.yml's test matrix
      # (22 today, which `engines` also admits): typings from a newer major
      # would let a Node-26-only API through typecheck to fail at runtime on
      # the 22 leg, with nothing in the toolchain saying why. Dependabot
      # offered 26.4.0 as #72 and 26.6.5 as #79 (2026-10-26) with every gate
      # green; both closed for this reason, and `tests/manifest.test.ts` pins
      # the installed typings major to the engines floor and the matrix floor
      # so the rule does not depend on anyone reading this. When the floor
      # moves, bump the typings with it and KEEP this entry -- it only stops
      # earning its keep when the floor is the newest Node major, which is
      # when there is nothing left to ignore. One cost, accepted the same way
      # the typescript entry accepts it: an ignore also suppresses Dependabot's
      # security updates, so an advisory fixed only in a newer @types/node
      # major would surface as a red `npm audit` rather than as a PR.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
