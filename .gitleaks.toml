title = "spicy-discount-searcher"

[extend]
useDefault = true

# The whole point of this repo is a list of corporate rate codes — short
# alphanumeric strings like "N0156333" that trip generic high-entropy rules.
# They are not credentials: they identify a negotiated rate, they are published
# widely, and they grant no access to anything.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
paths = [
  '''src/data/codes\.generated\.json''',
  '''data/source/.*\.xlsx''',
  '''README\.md''',
  # Belt-and-braces only, and worth being honest about: gitleaks' own default
  # config has a *global* allowlist covering `package-lock.json` (and every
  # other lockfile), which `useDefault = true` above inherits. So the lockfile
  # is already exempt from every rule, including AWS keys, GitHub PATs and
  # private keys — verified against upstream v8.28.0, and by planting an
  # `AKIA…` string in it and watching gitleaks report the identical string in
  # a sibling file and not in the lockfile.
  #
  # That is a real gap: a lockfile is somewhere credentials land, in an
  # authenticated registry URL or a leftover `_auth` line. It is not one this
  # config can close — `useDefault` merges, and there is no mechanism to
  # subtract a path from an inherited global allowlist. Recorded rather than
  # papered over.
  '''package-lock\.json''',
]

# Everything is scoped to the one rule above, and there is deliberately no
# global `[allowlist]` block in *this* file: a global entry exempts a path from
# every rule, which is a much bigger promise than "this file trips the entropy
# heuristic". `package-lock.json` used to sit in one and now sits with the rest
# — though see its note above for what the inherited default already does.
#
# gitleaks still never reads the .xlsx: it skips binaries by extension before
# any repo config applies, and a debug run reports "scanned ~0 bytes" for the
# workbook with no config at all. That gap is covered outside gitleaks —
# `scripts/scan_workbook_pii.py` unzips the workbook and scans its XML, and it
# runs in the same `secret scan` job right after this. It looks at the working
# tree rather than history, so it answers "what ships", not "what was ever
# committed"; gitleaks with fetch-depth: 0 still owns the history question.
